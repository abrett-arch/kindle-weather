name: Render dashboard

on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 minutes (GitHub often runs these a few minutes late)
  workflow_dispatch: {}         # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install pillow==11.0.0 numpy==2.1.3

      - name: Fetch the previous screen (what to flip from, and what changed)
        run: |
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          t=$(date +%s)
          curl -fsS -m 20 -H 'Cache-Control: no-cache' "$base/state.json?t=$t" -o prev_state.json || echo "no previous state"
          curl -fsS -m 20 -H 'Cache-Control: no-cache' "$base/dash.png?t=$t" -o prev_dash.png || echo "no previous image"

      - name: Render
        run: python render.py --out site/dash.png --prev prev_state.json --prev-image prev_dash.png

      - name: Message page for the iPhone
        run: cp web/* site/

      - name: Kindle code for over-the-air updates (site/kindle + manifest.txt)
        run: |
          src=kindle/extensions/weatherdash; dst="$PWD/site/kindle"
          mkdir -p "$dst"
          ( cd "$src" && find . -type f ! -name '*.log' | sed 's|^\./||' | LC_ALL=C sort | while read -r f; do
              mkdir -p "$dst/$(dirname "$f")"; cp "$f" "$dst/$f"; echo "$(md5sum "$f" | cut -d' ' -f1) $f"
            done ) > files.txt
          { echo "version $(md5sum files.txt | cut -c1-12)"; cat files.txt; } > "$dst/manifest.txt"
          head -1 "$dst/manifest.txt"

      - name: Index page
        run: |
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
          <title>Hobart weather dashboard</title>
          <body style="margin:0;background:#888;display:grid;place-items:center;min-height:100vh">
          <img src="preview.png" style="max-width:100%;max-height:100vh" alt="Hobart weather">
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  keepalive:
    # GitHub switches off scheduled workflows after 60 days without repository activity;
    # re-enabling it on every run keeps it going. Separate job so only this step can do it.
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/dash.yml/enable" \
            || echo "::warning::keep-alive failed (schedule may be disabled after 60 idle days)"
